name: KnockOS Social Integration CI

on:
  push:
    branches:
      - feat/knock-social-capability-export-20260820
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -c constraints.txt -e .[dev]

      - name: Run full test suite
        run: pytest -q

      - name: Build installable wheel
        run: python -m build

      - name: Smoke install KnockOS integration CLIs
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/knock-social-smoke
          /tmp/knock-social-smoke/bin/pip install --quiet dist/*.whl
          /tmp/knock-social-smoke/bin/agent-reach-knock --help >/dev/null
          /tmp/knock-social-smoke/bin/agent-reach-knock-collect --help >/dev/null

      - name: Publish verifiable commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"Agent Reach KnockOS Social","description":"Agent Reach social integration CI: %s"}' "$state" "$JOB_STATUS")
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$payload" >/dev/null
