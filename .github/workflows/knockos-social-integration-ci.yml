name: KnockOS Social Integration CI

on:
  push:
    branches:
      - feat/knock-social-capability-export-20260820
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: install
        name: Install package and test dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip build
          pip install -c constraints.txt -e .[dev]

      - id: tests
        name: Run full test suite
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: pytest -q

      - id: wheel
        name: Build installable wheel
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: python -m build

      - id: smoke
        name: Smoke install KnockOS integration CLIs
        if: always() && steps.wheel.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/knock-social-smoke
          /tmp/knock-social-smoke/bin/pip install --quiet dist/*.whl
          /tmp/knock-social-smoke/bin/agent-reach-knock --help >/dev/null
          /tmp/knock-social-smoke/bin/agent-reach-knock-collect --help >/dev/null

      - name: Publish verifiable step statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local context="$1" outcome="$2"
            local state=error
            [ "$outcome" = success ] && state=success
            [ "$outcome" = failure ] && state=failure
            payload=$(printf '{"state":"%s","context":"%s","description":"%s"}' "$state" "$context" "$outcome")
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "$payload" >/dev/null
          }
          publish "Agent Reach Install" "$INSTALL"
          publish "Agent Reach Tests" "$TESTS"
          publish "Agent Reach Wheel" "$WHEEL"
          publish "Agent Reach CLI Smoke" "$SMOKE"

      - name: Enforce integration acceptance
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$INSTALL" "$TESTS" "$WHEEL" "$SMOKE"; do
            [ "$value" = success ] || exit 1
          done
